name: Build and publish updates

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sparkle-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # semantic-release and publish-appcast.sh authenticate explicitly.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test
        run: swift test
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          cert="$RUNNER_TEMP/developer-id.p12"; keychain="$RUNNER_TEMP/whyfi.keychain-db"
          umask 077; printf '%s' "$CERTIFICATE" | base64 -D > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Only needed when WHYFI_UPDATES_REPO (updates.env) is another repo.
          WHYFI_UPDATES_TOKEN: ${{ secrets.WHYFI_UPDATES_TOKEN || github.token }}
          # Only increases. Renaming this file resets it, so don't.
          WHYFI_BUILD_NUMBER: ${{ github.run_number }}
          WHYFI_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in WHYFI_SIGN_IDENTITY SPARKLE_PRIVATE_KEY; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is not set"; exit 1; }
          done
          npm ci --no-audit --no-fund
          npx semantic-release
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/whyfi.keychain-db" 2>/dev/null || true
